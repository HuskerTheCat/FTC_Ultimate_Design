<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1221" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://huskerthecat.github.io https://*.googleapis.com https://api.github.com ws://localhost:* ws://127.0.0.1:* http://127.0.0.1:9099 http://127.0.0.1:8080; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'" />
    <title>FTC Ultimate Design</title>
    <meta name="description" content="Free design app for FTC robotics teams." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- The loading screen's font and contour lines (#switching), fetched with the stylesheet so it shows complete from its first paint. -->
    <link rel="preload" href="/node_modules/@fontsource/orbitron/files/orbitron-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/orbitron/files/orbitron-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/topo.svg" as="image" crossorigin />
    <script src="switching.js"></script>
  </head>
  <body>
    <p class="status-banner">This app is still under development</p>
    <div id="app"></div>
    <div id="switching" data-app="design" aria-hidden="true"><img src="loading.svg" alt="" /><p><span class="name">FTC Ultimate</span><span class="app-name">Design</span></p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
